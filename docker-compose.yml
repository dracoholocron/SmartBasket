# =============================================================================
# SmartBasket — Basketball Highlight Agent & Platform
# Stack Docker multi-contenedor con soporte GPU (NVIDIA CUDA)
#
# Nota: Compose v2 no usa la clave top-level `version`; emitía un warning
# en cada comando y fue removida.
# =============================================================================

services:

  # ─── Pipeline principal (YOLO + FFmpeg + OpenCV + candidatos) ─────────────
  pipeline:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.pipeline
    image: smartbasket-pipeline:latest
    container_name: smartbasket-pipeline
    runtime: nvidia
    volumes:
      - ./basketball-highlight-agent/videos:/app/videos
      - ./basketball-highlight-agent/data:/app/data
      - ./basketball-highlight-agent/models:/app/models
      - ./basketball-highlight-agent/configs:/app/configs
      - ./basketball-highlight-agent/src:/app/src
      - ./basketball-highlight-agent/scripts:/app/scripts
      - ./basketball-highlight-agent/tests:/app/tests
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - PYTHONPATH=/app/src
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    env_file:
      - .env
    working_dir: /app
    stdin_open: true
    tty: true
    networks:
      - smartbasket-net
    profiles:
      - pipeline
      - full

  # ─── VLM Service (Qwen2.5-VL-3B-Instruct) ────────────────────────────────
  vlm:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.vlm
    image: smartbasket-vlm:latest
    container_name: smartbasket-vlm
    runtime: nvidia
    volumes:
      - ./basketball-highlight-agent/videos:/app/videos
      - ./basketball-highlight-agent/data:/app/data
      - ./basketball-highlight-agent/models:/app/models
      - ./basketball-highlight-agent/configs:/app/configs
      - ./basketball-highlight-agent/src:/app/src
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - PYTHONPATH=/app/src
      - TRANSFORMERS_CACHE=/app/models/vlm
      - HF_HOME=/app/models/vlm
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    env_file:
      - .env
    ports:
      - "8001:8001"
    networks:
      - smartbasket-net
    profiles:
      - vlm
      - full
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ─── Reviewer UI (Streamlit) ──────────────────────────────────────────────
  reviewer:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.reviewer
    image: smartbasket-reviewer:latest
    container_name: smartbasket-reviewer
    volumes:
      - ./basketball-highlight-agent/videos:/app/videos
      - ./basketball-highlight-agent/data:/app/data
      - ./basketball-highlight-agent/models:/app/models
      - ./basketball-highlight-agent/configs:/app/configs
      - ./basketball-highlight-agent/src:/app/src
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/host_project:ro
    environment:
      - PYTHONPATH=/app/src
      - HOST_PROJECT_DIR=${PWD}
    env_file:
      - .env
    ports:
      - "8501:8501"
    networks:
      - smartbasket-net
    profiles:
      - reviewer
      - full
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Nginx Media Server: streaming estático ultrarrápido sin uso de RAM ──
  media-server:
    image: nginx:alpine
    container_name: smartbasket-media
    volumes:
      - ./basketball-highlight-agent/videos/clips:/usr/share/nginx/html/clips:ro
      - ./basketball-highlight-agent/data/history:/usr/share/nginx/html/history:ro
    ports:
      - "8082:80"
    networks:
      - smartbasket-net
    profiles:
      - reviewer
      - full

  # ─── Postgres 16 (Phase 2 Database) ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sportsdata-postgres
    environment:
      POSTGRES_USER: sportsdata
      POSTGRES_PASSWORD: sportsdata
      POSTGRES_DB: sportsdata
    volumes:
      - sportsdata_db:/var/lib/postgresql/data
    networks:
      - smartbasket-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsdata -d sportsdata"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - api
      - reviewer
      - full

  # ─── Sports Data API (Phase 2 Backend) ───────────────────────────────────
  api:
    build:
      context: ./sports-data-api
      dockerfile: Dockerfile
    image: sports-data-api:latest
    container_name: sportsdata-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - sports-data-api/.env
    environment:
      # DATABASE_URL: rol superuser, lo usa Alembic para correr DDL.
      DATABASE_URL: postgresql+asyncpg://sportsdata:sportsdata@postgres:5432/sportsdata
      # APP_DATABASE_URL: rol app_user (no-superuser, sujeto a RLS), lo usa
      # el runtime de FastAPI. Lo crea la migración b2d4f6a8c0e1.
      APP_DATABASE_URL: postgresql+asyncpg://app_user:app_user_dev_pwd@postgres:5432/sportsdata
    ports:
      - "8000:8000"
    volumes:
      - ./sports-data-api/src:/app/src
      - ./sports-data-api/migrations:/app/migrations
      - ./sports-data-api/alembic.ini:/app/alembic.ini
      - ./sports-data-api/scripts:/app/scripts
    # Hot-reload en dev: uvicorn vigila /app/src y recarga al guardar.
    command: ["uvicorn", "sports_data_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    networks:
      - smartbasket-net
    profiles:
      - api
      - reviewer
      - full

  # ─── Downloader ──────────────────────────────────────────────────────────
  downloader:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.pipeline
    image: smartbasket-pipeline:latest
    container_name: smartbasket-downloader
    runtime: nvidia
    volumes:
      - ./basketball-highlight-agent/videos:/app/videos
      - ./basketball-highlight-agent/data:/app/data
      - ./basketball-highlight-agent/models:/app/models
      - ./basketball-highlight-agent/configs:/app/configs
      - ./basketball-highlight-agent/scripts:/app/scripts
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - PYTHONPATH=/app/src
      - TRANSFORMERS_CACHE=/app/models/vlm
      - HF_HOME=/app/models/vlm
    env_file:
      - .env
    command: ["bash", "/app/scripts/download_models.sh"]
    networks:
      - smartbasket-net
    profiles:
      - setup

networks:
  smartbasket-net:
    name: smartbasket-net

volumes:
  sportsdata_db:
