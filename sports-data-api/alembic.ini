# Alembic config — sports-data-api
# DATABASE_URL se inyecta en migrations/env.py desde el settings de la app.
# Este archivo solo configura logging y la ubicación de scripts.

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
# El timezone para los timestamps en los nombres de los archivos de migration
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url se setea programáticamente en env.py
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
